name: Deploy to GitHub Pages

on:
  push:
    # The repo's default branch is master; main is included so a rename or
    # a fork that uses main still deploys without editing this file.
    branches: [master, main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the official actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 needs Node ^20.19 or >=22.12 — 22 is the safe default.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Resolve base path
        # Project sites are served under /<repo>/. Root sites need BASE_PATH=/.
        run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Add Pages fallbacks
        run: |
          # Hash routing never deep-links, but this keeps a stale URL from
          # showing GitHub's 404 page.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
