name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal, deploy-only permissions per GitHub's official Pages recipe.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy run in *separate* jobs on purpose.
  # deploy-pages looks the artifact up by name right after it is finalized; when
  # both steps share a job that lookup occasionally lists zero artifacts
  # (actions/deploy-pages#451). A separate job adds a runner-start gap and the
  # lookup is reliable.
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The site lives at the repository root.
          path: .
          # v5 excludes dotfiles by default; .nojekyll must ship.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
