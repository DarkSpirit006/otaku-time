name: Bug report

description: Report something that is broken in Otaku Time

title: "[Bug]: "

labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Your data always stays in your
        browser — please **never paste exported backups or personal data** here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open the Recently aired section, …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Smallest set of steps that triggers the problem.
      placeholder: |
        1. Open …
        2. Click …
        3. See error
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where you saw it (GitHub Pages URL or localhost). Don't include query strings with personal data.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any red errors from the browser developer console (F12 → Console).
      render: text

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge (latest)
        - Firefox (latest)
        - Safari (latest)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This happens with no browser extensions enabled
