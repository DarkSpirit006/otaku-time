name: Feature request

description: Suggest an improvement for Otaku Time

title: "[Feature]: "

labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Otaku Time is intentionally small: exactly three sections, local-only data,
        vanilla HTML/CSS/JS, no accounts and no backend. Feature ideas are welcome —
        proposals that keep those constraints are easiest to act on.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The need behind the request, not the implementation.
      placeholder: I often lose track of which shows I paused mid-season because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see in the app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you use today.

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints check
      options:
        - label: This idea works without accounts, servers, or a database
          required: true
        - label: This idea does not require a framework or build step
        - label: I searched existing issues for similar requests
          required: true
