<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description"
    content="Otaku Time tracks upcoming anime episodes, your watchlist, and recently aired shows with data from AniList. Everything stays in your browser." />
  <title>Otaku Time</title>

  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var KEY = "otaku-time.theme.v1";
      var LEGACY = "okaeri.theme.v1";
      var choices = ["light", "dark", "auto", "system"];
      var saved = null;
      try {
        saved = localStorage.getItem(KEY);
        if (saved === null) saved = localStorage.getItem(LEGACY);
      } catch (e) { /* storage unavailable */ }
      var preference = choices.indexOf(saved) !== -1 ? saved : "dark"; // dark by default
      var followsSystem = preference === "auto" || preference === "system";
      var dark = preference === "dark" ||
        (followsSystem && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? "dark" : "light";
      root.style.colorScheme = dark ? "dark" : "light";
      root.dataset.themePreference = preference;
    })();
  </script>

  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="./assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components/buttons.css" />
  <link rel="stylesheet" href="./css/components/cards.css" />
  <link rel="stylesheet" href="./css/components/forms.css" />
  <link rel="stylesheet" href="./css/components/dialogs.css" />
  <link rel="stylesheet" href="./css/features/upcoming.css" />
  <link rel="stylesheet" href="./css/features/watchlist.css" />
  <link rel="stylesheet" href="./css/features/recently-aired.css" />
  <link rel="stylesheet" href="./css/features/search.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Shared SVG paint servers (referenced by brand marks) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="ot-brand-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6d5efc" />
        <stop offset=".5" stop-color="#b45cf0" />
        <stop offset="1" stop-color="#ff6b8b" />
      </linearGradient>
    </defs>
  </svg>

  <noscript>
    <div class="noscript-notice">
      <strong>Otaku Time needs JavaScript.</strong>
      <p>The schedule, watchlist, and search features require JavaScript to run.</p>
    </div>
  </noscript>

  <div class="app">
    <aside class="sidebar" aria-label="Application">
      <a class="brand" href="#upcoming" aria-label="Otaku Time — go to Upcoming">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <circle cx="16" cy="16" r="12.5" fill="none" stroke="url(#ot-brand-gradient)" stroke-width="3" />
            <path d="M13.6 11.7 21 16l-7.4 4.3z" fill="url(#ot-brand-gradient)" />
          </svg>
        </span>
        <span class="brand__name">Otaku Time</span>
      </a>

      <nav class="nav" aria-label="Sections">
        <span class="nav__indicator" aria-hidden="true"></span>
        <a class="nav__link" href="#upcoming" data-nav="upcoming">
          <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect>
            <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"></path>
            <path d="M12 12.5v3l2 1.2"></path>
          </svg>
          <span>Upcoming</span>
        </a>
        <a class="nav__link" href="#watchlist" data-nav="watchlist">
          <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 4.5h11v15L12 16l-5.5 3.5z" stroke-linejoin="round"></path>
          </svg>
          <span>Watchlist</span>
          <span class="nav__count" data-nav-count hidden>0</span>
        </a>
        <a class="nav__link" href="#recent" data-nav="recent">
          <svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path>
            <path d="M4.2 4.8v4h4"></path>
            <path d="M12 8.5V12l2.5 1.5"></path>
          </svg>
          <span>Recently aired</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="sync js-sync" role="status" data-state="loading">
          <span class="sync__dot" aria-hidden="true"></span>
          <span class="sync__text">Loading</span>
        </div>
        <div class="sidebar__actions">
          <button class="icon-btn js-refresh" title="Refresh schedule" aria-label="Refresh schedule">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"></path>
              <path d="M19.8 4.8v4h-4"></path>
            </svg>
          </button>
          <button class="icon-btn js-theme-toggle" title="Switch theme" aria-label="Switch theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6">
              </path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8.3 8.3 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"></path>
            </svg>
          </button>
          <button class="icon-btn js-settings-open" title="Settings" aria-label="Open settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3.1"></circle>
              <path
                d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.24.63.85 1.05 1.53 1.07H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5.53z">
              </path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <a class="topbar__brand" href="#upcoming" aria-label="Otaku Time — go to Upcoming">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <circle cx="16" cy="16" r="12.5" fill="none" stroke="url(#ot-brand-gradient)" stroke-width="3" />
              <path d="M13.6 11.7 21 16l-7.4 4.3z" fill="url(#ot-brand-gradient)" />
            </svg>
          </span>
          <span class="topbar__brand-name">Otaku Time</span>
        </a>

        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <label class="sr-only" for="search">Search anime</label>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
            placeholder="Search anime, titles, synonyms…" />
          <kbd class="search__kbd" aria-hidden="true">/</kbd>
          <button id="clear-search" class="search__clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m7 7 10 10M17 7 7 17"></path>
            </svg>
          </button>
        </div>

        <div class="topbar__extras">
          <div class="sync js-sync topbar__sync" role="status" data-state="loading">
            <span class="sync__dot" aria-hidden="true"></span>
            <span class="sync__text">Loading</span>
          </div>
          <div class="clock">
            <time id="clock" class="clock__time">--:--:--</time>
            <span id="clock-date" class="clock__date">—</span>
          </div>
          <button class="icon-btn topbar__action js-refresh" title="Refresh schedule"
            aria-label="Refresh schedule">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"></path>
              <path d="M19.8 4.8v4h-4"></path>
            </svg>
          </button>
          <button class="icon-btn topbar__action js-theme-toggle" title="Switch theme"
            aria-label="Switch theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6">
              </path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8.3 8.3 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"></path>
            </svg>
          </button>
          <button class="icon-btn topbar__action js-settings-open" title="Settings"
            aria-label="Open settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3.1"></circle>
              <path
                d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.24.63.85 1.05 1.53 1.07H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5.53z">
              </path>
            </svg>
          </button>
        </div>
      </header>

      <main id="main" class="content" tabindex="-1">
        <div id="app"></div>
      </main>

      <footer class="footer">
        <span class="footer__brand">Otaku Time</span>
        <span class="footer__meta">
          Schedule data from
          <a href="https://anilist.co" target="_blank" rel="noopener noreferrer">AniList&nbsp;↗</a>
          · Your data stays in this browser
        </span>
      </footer>
    </div>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <span class="tabbar__indicator" aria-hidden="true"></span>
    <a class="tabbar__link" href="#upcoming" data-nav="upcoming">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect>
        <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"></path>
        <path d="M12 12.5v3l2 1.2"></path>
      </svg>
      <span>Upcoming</span>
    </a>
    <a class="tabbar__link" href="#watchlist" data-nav="watchlist">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6.5 4.5h11v15L12 16l-5.5 3.5z" stroke-linejoin="round"></path>
      </svg>
      <span>Watchlist</span>
      <span class="tabbar__count" data-nav-count hidden>0</span>
    </a>
    <a class="tabbar__link" href="#recent" data-nav="recent">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path>
        <path d="M4.2 4.8v4h4"></path>
        <path d="M12 8.5V12l2.5 1.5"></path>
      </svg>
      <span>Recently&nbsp;aired</span>
    </a>
  </nav>

  <dialog id="detail-dialog" class="dialog dialog--detail" aria-labelledby="detail-title">
    <div id="detail-content"></div>
  </dialog>

  <dialog id="settings-dialog" class="dialog dialog--settings" aria-labelledby="settings-title">
    <div id="settings-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
