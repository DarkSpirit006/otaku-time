<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets us use safe-area insets on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d0c0a" />
  <meta name="color-scheme" content="dark light" />
  <!-- Apply the saved theme before first paint — no flash. -->
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("otaku-time.theme.v1") || "dark";
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <meta name="description"
    content="Otaku Time — upcoming anime episodes, your watchlist and recently aired shows, powered by AniList. Everything stays in your browser." />
  <title>Otaku Time — Anime Broadcast Almanac</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0c0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff4526' stroke-width='3'/%3E%3Cpath d='M16 10v6l4 3' fill='none' stroke='%23ece6d8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://graphql.anilist.co" />
  <link rel="preconnect" href="https://s4.anilist.co" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
